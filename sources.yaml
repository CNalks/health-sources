# 来源清单：每个来源一个适配器（adapter），license / figures_allowed 按来源设定。
# 发现靠各刊自己的 RSS；Europe PMC 不再是来源，只在 enrich 步骤里按 DOI 回查补摘要/许可/PMCID/关键词。
defaults:
  timeout: 40          # 秒
  retries: 2
  user_agent: "health-sources/0.3 (+https://github.com/CNalks/health-sources)"

# 已停用的来源：每次运行开始时删除库里它们的记录（不再导出）
retired_sources:
  - europepmc     # v0.1 曾按检索式广泛抓取，和逐刊订阅重复，已改为下面 enrich 的按 DOI 回查

# 补全：kind=article 且有 DOI、摘要或许可为空的记录，按 DOI 回查 Europe PMC，只填空字段
enrich:
  enabled: true
  url: "https://www.ebi.ac.uk/europepmc/webservices/rest/search"
  max_per_run: 60        # 每次运行最多查几篇
  delay_seconds: 1.0     # 请求间隔
  timeout: 20
  retries: 1
  window_days: 30        # 发布后 30 天内反复尝试（Europe PMC 收录可能晚 10 天以上）
  retry_after_hours: 20  # 查不到 / 仍缺摘要：隔天再试
  max_seconds: 300       # 整个步骤的时间预算
  figures_allowed_licenses: ["cc0", "cc by", "cc by-sa"]   # 仅对 figures_allowed: per_record 的来源生效

# 导出：latest.jsonl 只放近 window_days 天（日常消费）；by-source/<来源>.jsonl 放近 by_source_days 天的全部记录，
# 供按期组织的下游（公卫前沿按卷期取 CDC Weekly 篇目）使用
export:
  window_days: 30
  by_source_days: 400

sources:
  - id: mmwr
    name: "MMWR (Morbidity and Mortality Weekly Report)"
    adapter: mmwr
    kind: article
    lang: en
    url: "https://tools.cdc.gov/api/v2/resources/media/342778.rss"
    max_items: 30          # feed 有 2000+ 条，只截取最新 N 条再解析
    resolve_links: true    # 把 tools.cdc.gov 下载跳转解析成 cdc.gov/mmwr 原文地址
    license: "Public Domain (U.S. CDC)"
    figures_allowed: true
    ignore_categories: ["MMWR", "Morbidity & Mortality Weekly Report"]
    ignore_summaries:      # feed 里的通用占位描述，不当摘要
      - "The Morbidity and Mortality Weekly Report (MMWR) Series is prepared by the Centers for Disease Control and Prevention (CDC)."
    backfill:              # 全量 feed 本身就是往期入口：流式分块读，条目不按时间排序，只留 since 之后的
      method: full_feed
      batch_items: 100
      delay_seconds: 0.5   # 解析下载跳转（HEAD）之间的间隔

  - id: eurosurveillance
    name: "Eurosurveillance"
    adapter: rss
    kind: article
    lang: en
    url: "https://www.eurosurveillance.org/rss/content/eurosurveillance/latestarticles?fmt=rss"
    max_items: 50
    doi_from_url: true
    license: "CC BY 4.0"
    figures_allowed: true
    backfill:              # 官网按期 RSS 返回空、目录页是 HTML；改用 DOI 注册机构 Crossref 的官方 API 按 ISSN 列出
      method: crossref
      url: "https://api.crossref.org/journals/{issn}/works"
      issn: "1560-7917"
      url_style: prefix
      url_prefix: "https://www.eurosurveillance.org/content/"
      rows: 100
      delay_seconds: 1.0

  - id: who_don
    name: "WHO Disease Outbreak News"
    adapter: who_don
    kind: news
    lang: en
    url: "https://www.who.int/api/news/diseaseoutbreaknews"
    item_url_prefix: "https://www.who.int/emergencies/disease-outbreak-news/item/"
    max_items: 40
    license: "CC BY-NC-SA 3.0 IGO"
    figures_allowed: false   # NC-SA：非商用+相同方式共享，默认不配图
    backfill:
      method: odata_pages
      page_size: 50
      delay_seconds: 1.0

  - id: eid
    name: "Emerging Infectious Diseases (ahead of print)"
    adapter: rss
    kind: article
    lang: en
    url: "https://wwwnc.cdc.gov/eid/rss/ahead-of-print.xml"
    max_items: 50
    doi_from_url: true
    license: "Public Domain (U.S. CDC)"
    figures_allowed: true
    backfill:              # 官网只有提前在线 feed，没有按期 feed；用 Crossref 按 ISSN 列出（含已归期文章）
      method: crossref
      url: "https://api.crossref.org/journals/{issn}/works"
      issn: "1080-6059"
      url_style: eid
      rows: 100
      delay_seconds: 1.0

  - id: ecdc
    name: "ECDC (CDTR / Risk assessment / Epidemiological update / News)"
    adapter: rss
    kind: news
    lang: en
    feeds:
      - url: "https://www.ecdc.europa.eu/en/taxonomy/term/1505/feed"
        category: "Communicable disease threats report"
      - url: "https://www.ecdc.europa.eu/en/taxonomy/term/1295/feed"
        category: "Risk assessment"
      - url: "https://www.ecdc.europa.eu/en/taxonomy/term/1310/feed"
        category: "Epidemiological update"
      - url: "https://www.ecdc.europa.eu/en/taxonomy/term/1307/feed"
        category: "News"
    max_items: 20          # 每个 feed
    license: "© ECDC, reproduction authorised provided the source is acknowledged"
    figures_allowed: true
    backfill:              # taxonomy feed 支持 ?page=N（Drupal 分页）
      method: feed_pages
      page_param: page
      max_pages: 15
      delay_seconds: 2.0

  - id: plos_ntds
    name: "PLOS Neglected Tropical Diseases"
    adapter: rss
    kind: article
    lang: en
    url: "https://journals.plos.org/plosntds/feed/atom"
    max_items: 50
    license: "CC BY 4.0"
    figures_allowed: true
    backfill:              # PLOS 官方搜索 API（Solr）
      method: plos_search
      url: "https://api.plos.org/search"
      journal_key: PLoSNTD
      article_url: "https://journals.plos.org/plosntds/article?id={doi}"
      rows: 100
      delay_seconds: 1.5

  - id: cdc_weekly
    name: "China CDC Weekly (current issue)"
    adapter: ccdc          # RSS 1.0 / RDF，条目自带 <prism:doi> 和 PRISM 卷期字段（解析与公卫前沿 fetch-ccdc.mjs 一致）
    kind: article
    lang: en
    url: "https://weekly.chinacdc.cn/rss/current.xml"
    max_items: 50
    feed_summary: false    # feed 描述只有卷期页码，不是摘要；摘要靠 enrich 按 DOI 回查
    # 只读订阅 RSS，不抓文章页面（官网会弹验证码）；公卫前沿自己的采集（火山云 cdc-ingest）不受影响
    license: "CC BY-NC 4.0"
    figures_allowed: false
    backfill:              # 往期 RSS：rss/{年}_{期}.xml；官网有频率风控，请求间隔放宽
      method: ccdc_issues
      url_template: "https://weekly.chinacdc.cn/rss/{year}_{issue}.xml"
      delay_seconds: 6

  - id: cdc_thn
    name: "US CDC Travel Health Notices"
    adapter: rss
    kind: news
    lang: en
    url: "https://wwwnc.cdc.gov/travel/rss/notices.xml"
    max_items: 40
    doi_from_url: false
    feed_summary: true
    license: "Public Domain (U.S. CDC)"
    figures_allowed: true
    # 旅行健康通报：与 NNDSS 数值分家；只进 health-sources，不进时间序列

  - id: africa_cdc
    name: "Africa CDC News"
    adapter: rss
    kind: news
    lang: en
    url: "https://africacdc.org/news-item/feed/"
    max_items: 30
    doi_from_url: false
    feed_summary: true
    license: "© Africa CDC; reproduction for non-commercial use with attribution"
    figures_allowed: false
    # 综合新闻流（含疫情通报与机构新闻）；GHS 事件页侧再按疫情关键词筛选展示

  - id: paho
    name: "PAHO Epidemiological Alerts and Updates"
    adapter: paho
    kind: news
    lang: en
    url: "https://www.paho.org/en/epidemiological-alerts-and-updates"
    pages: 2               # 列表页每页约 15 条
    max_items: 30
    license: "© PAHO/WHO; reuse per PAHO terms (attribution required)"
    figures_allowed: false
    # paho.org 拦机房 IP（阿里云 403）：GitHub Actions 直连抓取后推到服务器收件箱，日常采集读收件箱。
    # 收件箱缺失/超时 → 该来源标 stale，不造数据。见 README「被拦来源（GitHub Actions 代抓）」。
    # Actions 直连时会尝试抓页面 meta description 填 summary。
    fetch_summaries: true
    summary_delay_seconds: 0.4
    inbox: "/var/lib/health-sources/inbox/paho.jsonl"
    inbox_max_age_hours: 72

  - id: ukhsa
    name: "UK Health Security Agency (news)"
    adapter: rss
    kind: news
    lang: en
    url: "https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=uk-health-security-agency"
    max_items: 30
    doi_from_url: false
    feed_summary: true
    license: "Open Government Licence v3.0 (Crown copyright)"
    figures_allowed: true
    # GOV.UK Atom；GHS 侧再按疫情关键词筛选展示

  - id: cdc_han
    name: "US CDC Health Alert Network (HAN)"
    adapter: rss
    kind: news
    lang: en
    url: "https://tools.cdc.gov/api/v2/resources/media/413690.rss"
    max_items: 20
    doi_from_url: false
    feed_summary: true
    license: "Public Domain (U.S. CDC)"
    figures_allowed: true
    allow_empty: true   # feed 经常无新条目；空结果算成功，不标 stale
    # 紧急卫生公告；条数通常很少

  - id: hk_chp
    name: "Hong Kong CHP press releases"
    adapter: rss
    kind: news
    lang: en
    url: "https://www.chp.gov.hk/rss/pressreleases_en_RSS.xml"
    url_origin: "https://www.chp.gov.hk"
    max_items: 30
    doi_from_url: false
    feed_summary: true
    license: "© Hong Kong CHP; reuse subject to CHP Important Notices"
    figures_allowed: false

  - id: who_afro
    name: "WHO AFRO Emergencies"
    adapter: rss
    kind: news
    lang: en
    url: "https://www.afro.who.int/rss/emergencies.xml"
    max_items: 20
    doi_from_url: false
    feed_summary: true
    license: "CC BY-NC-SA 3.0 IGO (WHO)"
    figures_allowed: false

  - id: phac_news
    name: "Canada Health / PHAC news (GC News)"
    adapter: rss
    kind: news
    lang: en
    url: "https://api.io.canada.ca/io-server/gc/news/en/v2?dept=departmentofhealth&sort=publishedDate&orderBy=desc&publishedDate%3E=2024-01-01&pick=40&format=atom&atomtitle=Health%20Canada"
    max_items: 30
    doi_from_url: false
    feed_summary: true
    license: "Crown copyright (Canada); verify per-item Open Government Licence"
    figures_allowed: false
    # 卫生部综合新闻；旅行健康 notices 旧 RSS 已 404。GHS 侧过滤非疫情条目。

  - id: tw_cdc
    name: "Taiwan CDC English news"
    adapter: rss
    kind: news
    lang: en
    url: "https://www.cdc.gov.tw/En/RSS/RssXml/sOn2_m9QgxKqhZ7omgiz1A?type=1"
    max_items: 30
    doi_from_url: false
    feed_summary: true
    license: "© Taiwan CDC; subject to site terms"
    figures_allowed: false
    # 阿里云不可达：GitHub Actions 代抓后推 inbox（同 PAHO）
    inbox: "/var/lib/health-sources/inbox/tw_cdc.jsonl"
    inbox_max_age_hours: 72
